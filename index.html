<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/goririn.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14161f">
<title>ぬいぐるみモンスター（プロトタイプ v0.2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Misaki'; src: url('assets/misaki_gothic.ttf') format('truetype'); font-display: swap; }
  html, body { margin: 0; height: 100%; background: #14161f; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
  #nameBox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,14,30,.55); z-index: 8; touch-action: auto; }
  #nameBox.on { display: flex; }
  #nameBox form { background: #f4e4b8; border: 4px solid #5a3418; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font: 18px 'Misaki', sans-serif; color: #5a3418; }
  #nameBox input { font: 22px 'Misaki', sans-serif; padding: 6px 8px; width: 12em; border: 3px solid #5a3418; background: #fffaf0; -webkit-user-select: text; user-select: text; }
  #nameBox .row { display: flex; gap: 8px; justify-content: flex-end; }
  #nameBox button { font: 18px 'Misaki', sans-serif; padding: 6px 14px; border: 3px solid #5a3418; background: #ffd23a; color: #5a3418; }
  #nameBox button[type=button] { background: #fff8e0; }
  #err { position: fixed; top: 8px; left: 8px; color: #f88; font: 14px monospace; white-space: pre; pointer-events: none; z-index: 9; }
  .ctl { position: absolute; display: none; z-index: 5; touch-action: none; }
  body.touch .ctl { display: block; }
  .ctl.off { opacity: 0.2 !important; pointer-events: none; }
  .ctl.hide { display: none !important; }
  .btn { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
         background: #f4e4b8; border: 3px solid #5a3418; border-radius: 14px; color: #5a3418;
         box-shadow: inset 0 -5px 0 #d8bf8a, 0 3px 0 rgba(0,0,0,.35);
         font-family: 'Misaki', 'DotGothic16', monospace; font-size: 16px; line-height: 1; white-space: nowrap; letter-spacing: -1px; touch-action: none; }
  .btn.on { background: #ffd23a; transform: translateY(2px); box-shadow: inset 0 -2px 0 #d8a82a, 0 1px 0 rgba(0,0,0,.35); }
  .btn.round { border-radius: 50%; }
  .btn svg { width: 46%; height: 46%; shape-rendering: crispEdges; }
  #pad .btn { font-size: 0; }
  #jump { background: #6cc547; color: #fff; border-color: #1f4a18; box-shadow: inset 0 -5px 0 #3c9a40, 0 3px 0 rgba(0,0,0,.35); text-shadow: 0 2px 0 #1f4a18; }
  #jump.on { background: #9ae070; }
  #swap { background: #ff9ac8; color: #fff; border-color: #7a2a4c; box-shadow: inset 0 -5px 0 #d4588c, 0 3px 0 rgba(0,0,0,.35); text-shadow: 0 2px 0 #7a2a4c; }
  #swap.on { background: #ffc0dc; }
  body.overlay .ctl { opacity: 0.62; }
  #rotate { position: absolute; display: none; left: 0; right: 0; text-align: center; color: #fff6b0; z-index: 4;
            font-family: 'Misaki', 'DotGothic16', monospace; font-size: 16px; line-height: 24px; pointer-events: none; }
  #rotate { display: none !important; }
  #rotate .ph { display: inline-block; font-size: 28px; animation: rot 2.4s infinite ease-in-out; }
  @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="pad" class="ctl">
  <div class="btn" id="bL"><svg viewBox="0 0 7 7"><path d="M5 0h1v7H5zM4 1h1v5H4zM3 2h1v3H3zM2 3h1v1H2z" fill="#5a3418"/></svg></div>
  <div class="btn" id="bR"><svg viewBox="0 0 7 7"><path d="M1 0h1v7H1zM2 1h1v5H2zM3 2h1v3H3zM4 3h1v1H4z" fill="#5a3418"/></svg></div>
</div>
<div id="acts" class="ctl">
  <div class="btn round" id="swap">いれかえ</div>
  <div class="btn round" id="jump">ジャンプ</div>
</div>
<div id="nameBox"><form><label id="nameLab">なまえ（6もじまで）</label><input id="nameIn" maxlength="6" autocomplete="off"><div class="row"><button type="button" id="nameNo">やめる</button><button type="submit">けってい</button></div></form></div>
<div id="err"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="assets-img.js?v=7"></script>
<script src="data.js?v=19"></script>
<script src="bg.js?v=9"></script>
<script src="game.js?v=43"></script>
</body>
</html>
