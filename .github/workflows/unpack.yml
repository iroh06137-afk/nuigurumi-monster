name: unpack game zip
on:
  push:
    branches: [main]
    paths:
      - nuigurumi-pages-upload.zip
      - .github/workflows/unpack.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unzip if present
        run: |
          if [ ! -f nuigurumi-pages-upload.zip ]; then
            echo "no zip, skip"
            exit 0
          fi
          unzip -o nuigurumi-pages-upload.zip -d .
          rm -f nuigurumi-pages-upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Unpack game files from zip"
            git push
          fi
